# Kept modest so the build and the emulator fit together in 16 GB of RAM (earlyoom kills the
# emulator otherwise), same as the user's other Android projects. The Kotlin compiler runs
# inside the Gradle daemon instead of its own JVM.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
