# Kept modest so the build and the emulator fit together in 16 GB of RAM (earlyoom kills the
# emulator otherwise), same as the user's other Android projects. The Kotlin compiler runs
# inside the Gradle daemon instead of its own JVM.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Optional adapters (GUIDELINES.md §1 point 2, §2.2): false leaves the adapter out of the build entirely, and the app hides what
# needs it. Cut-outs: background removal with ML Kit via Google Play services (ARCHITECTURE.md §7.5).
dressup.cutout=true
